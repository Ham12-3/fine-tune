# Banking77 data preparation (Phase 2)
# The HF dataset (PolyAI/banking77) is a loading script that current `datasets` no longer runs, and it
# has no parquet conversion. It downloads these same two CSVs, so we fetch them directly, pinned to the
# last commit that touched banking_data/ and checked against sha256. Licence: CC-BY-4.0.
source:
  repo: PolyAI-LDN/task-specific-datasets
  commit: 9d081458ff52e53cf7e848f414e6e9344e4e6696   # 2020-02-18
  files:
    train:
      path: banking_data/train.csv
      sha256: b06e26ac675513959a63135f11b94ea7786ed02da65db93a5650d8838cbc664b
      rows: 10003
    test:
      path: banking_data/test.csv
      sha256: d12d6e3bc4c3103966ae786dc435913c0c563dfa328f5a3646d0e62cfeeb474d
      rows: 3080
raw_dir: data/raw
out_dir: data/processed

seed: 42
val_frac: 0.10            # stratified hold-out from the official train split
test_sample_size: 1000    # stratified fixed sample of the official test split (Claude runs)
few_shot_per_label: 3     # examples per label for few-shot prompts, drawn from the train split only
sweep_fractions: [0.10, 0.25, 0.50, 1.00]   # nested stratified subsets of the train split (Phase 5)

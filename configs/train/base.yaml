# QLoRA hyperparameters (Phase 5). Base model chosen in Phase 3 (see README and results/summary/phase3_model_probe.json).
base_model: unsloth/Qwen3.5-2B   # Apache-2.0; hybrid Gated DeltaNet (18 layers) + full attention (6 layers)
load_in_4bit: true
max_seq_len: 128
seed: 42

lora:
  r: 16
  alpha: 32
  dropout: 0.0
  # Every linear layer of the language model, both layer types (the vision tower is untouched):
  #   full attention: q/k/v/o_proj; Gated DeltaNet: in_proj_qkv/z/a/b, out_proj; MLP: gate/up/down_proj
  target_modules: [q_proj, k_proj, v_proj, o_proj, in_proj_qkv, in_proj_z, in_proj_a, in_proj_b, out_proj,
                   gate_proj, up_proj, down_proj]

train:
  epochs: 3
  per_device_batch_size: 16
  grad_accum_steps: 1
  learning_rate: 2.0e-4
  lr_scheduler: cosine
  warmup_ratio: 0.03
  weight_decay: 0.0
  logging_steps: 10
  save_steps: 100          # checkpoint to Drive often (Colab can disconnect)
  save_total_limit: 2
  completion_only_loss: true

drive_root: /content/drive/MyDrive/small-vs-frontier
